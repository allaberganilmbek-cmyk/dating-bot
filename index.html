<head>

    <!-- Leaflet CSS & JS (Бесплатная замена Google Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --input-bg: #1e293b;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --user-msg: #0284c7;
            --match-msg: #334155;
            --success: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .toast-notification {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 41, 59, 0.95); border: 1px solid var(--accent);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            border-radius: 14px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
            z-index: 10000; width: 90%; max-width: 400px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;
        }
        .toast-notification.show { transform: translateX(-50%) translateY(0); }

        .disclaimer-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color); z-index: 9999; display: flex;
            justify-content: center; align-items: center; padding: 20px;
        }
        .disclaimer-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 24px; max-width: 400px; width: 100%;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 16px;
        }

        .container {
            width: 100%; max-width: 1100px; height: 90vh;
            background-color: var(--card-bg); display: flex; flex-direction: row;
            overflow: hidden; position: relative; border-radius: 20px;
            border: 1px solid var(--border-color); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .screen { display: none; flex-direction: column; width: 100%; height: 100%; padding: 24px; overflow-y: auto; flex: 1; }
        .screen.active { display: flex; animation: fadeIn 0.25s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.99); } to { opacity: 1; transform: scale(1); } }

        .form-header { text-align: center; margin-bottom: 20px; }
        .form-header h2 { font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .form-header p { color: var(--text-sub); font-size: 0.9rem; }

        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; }
        label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }

        input, select, textarea {
            padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background-color: var(--input-bg); color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s ease;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25); }

        .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .checkbox-group { display: flex; gap: 16px; align-items: center; margin-top: 4px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; text-transform: uppercase; font-weight: 600; }
        .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

        .btn {
            background: var(--accent-gradient); color: white; border: none; padding: 12px 20px;
            border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
            text-align: center; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3); transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-sub); box-shadow: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .profile-card {
            max-width: 480px; width: 100%; margin: 0 auto; border-radius: 20px; overflow: hidden;
            background: var(--input-bg); border: 1px solid var(--border-color); display: flex;
            flex-direction: column; position: relative; height: 100%;
        }

        .profile-card-image { width: 100%; height: 350px; background-size: cover; background-position: center; position: relative; user-select: none; cursor: pointer; }
        .profile-card-image-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(to top, rgba(15,23,42,1), transparent); }
        .profile-card-body { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; font-size: 0.9rem; flex: 1; }

        .photo-story-bars { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 20; }
        .photo-story-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; transition: background 0.2s; }
        .photo-story-bar.active { background: #ffffff; }

        .badge-grid { display: flex; flex-wrap: wrap; gap: 8px; }
        .badge { background: #0f172a; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; color: var(--text-sub); }
        .badge-accent { background: rgba(59, 130, 246, 0.15); border-color: var(--accent); color: var(--text-main); }

        .actions { display: flex; justify-content: center; gap: 20px; margin-top: 16px; align-items: center; }
        .action-btn { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.1); }
        .like { background-color: var(--success); color: white; }
        .dislike { background-color: var(--danger); color: white; }

        .avatar-img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .avatar-small { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; cursor: pointer; }

        .chat-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--border-color); margin-bottom: 14px; gap: 10px; }
        .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 6px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
        .message.user { background-color: var(--user-msg); align-self: flex-end; border-bottom-right-radius: 4px; }
        .message.match { background-color: var(--match-msg); align-self: flex-start; border-bottom-left-radius: 4px; }

        .chat-input { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        .chat-list-item { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--input-bg); border-radius: 14px; border: 1px solid var(--border-color); margin-bottom: 10px; transition: border-color 0.2s; }
        .chat-list-item:hover { border-color: var(--accent); }
        .chat-item-header { display: flex; align-items: center; gap: 12px; }
        .count-badge { background: var(--danger); color: #fff; font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 10px; }

        .bottom-nav {
            width: 220px; height: 100%; background: #0f172a; border-right: 1px solid var(--border-color);
            display: none; flex-direction: column; justify-content: flex-start; padding: 20px 10px; gap: 10px; z-index: 40; flex-shrink: 0;
        }
        .bottom-nav.active { display: flex; }
        .nav-item {
            background: none; border: none; color: var(--text-sub); font-size: 0.9rem; display: flex; flex-direction: row;
            align-items: center; gap: 12px; cursor: pointer; padding: 12px 16px; border-radius: 12px; width: 100%; transition: all 0.2s ease; position: relative;
        }
        .nav-item:hover { background: var(--input-bg); color: #fff; }
        .nav-badge { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: bold; padding: 2px 7px; border-radius: 10px; display: none; }
        .nav-item.active { background: var(--accent); color: #fff; font-weight: 700; }

        .map-modal { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--card-bg); display: none; flex-direction: column; z-index: 50; padding: 20px; }
        .map-modal.active { display: flex; }
        #leaflet-map { width: 100%; flex: 1; border-radius: 14px; margin: 12px 0; border: 1px solid var(--border-color); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }

        .preview-thumbnails { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; }
        .preview-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color); }

        @media (max-width: 768px) {
            body { padding: 0; }
            .container { height: 100vh; max-width: 100%; border-radius: 0; border: none; flex-direction: column; }
            .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; width: 100%; border-right: none; border-top: 1px solid var(--border-color); flex-direction: row; justify-content: space-around; padding: 0; }
            .nav-item { flex-direction: column; justify-content: center; font-size: 0.7rem; gap: 3px; padding: 0; border-radius: 0; text-align: center; }
            .screen { padding-bottom: 80px; }
            .message { max-width: 85%; }
        }
    </style>
</head>
<body>

<div id="toast-banner" class="toast-notification">
    <div style="font-size: 1.5rem;">💬</div>
    <div style="flex: 1; overflow: hidden;">
        <h5 id="toast-title" style="color: #fff; font-size: 0.85rem;">Новое сообщение</h5>
        <p id="toast-body" style="color: var(--text-sub); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">Текст...</p>
    </div>
</div>

<div id="disclaimer-modal" class="disclaimer-overlay">
    <div class="disclaimer-card">
        <div style="font-size: 3rem;">⚠️</div>
        <h2 style="font-size: 1.2rem; color: #fff;">Отказ от ответственности</h2>
        <p style="font-size: 0.9rem; color: var(--text-sub); line-height: 1.4;">Мы не несем ответственность за действия пользователей.</p>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button class="btn btn-secondary" style="flex: 1; color: var(--danger); border-color: var(--danger);" onclick="declineDisclaimer()">Не согласен</button>
            <button class="btn" style="flex: 1; margin: 0;" onclick="acceptDisclaimer()">Согласен</button>
        </div>
    </div>
</div>

<div class="container">
    <!-- МЕНЮ НАВИГАЦИИ -->
    <div id="bottom-nav" class="bottom-nav">
        <button class="nav-item active" id="nav-btn-swipe" onclick="switchNavTab('screen-swipe')"><span class="icon">🔍</span><span>Поиск</span></button>
        <button class="nav-item" id="nav-btn-preference" onclick="switchNavTab('screen-preference')"><span class="icon">⚙️</span><span>Типаж</span></button>
        <button class="nav-item" id="nav-btn-chats" onclick="switchNavTab('screen-chats-list')">
            <span class="nav-badge" id="chats-total-badge">0</span>
            <span class="icon">💬</span><span>Чаты</span>
        </button>
        <button class="nav-item" id="nav-btn-profile" onclick="switchNavTab('screen-profile')"><span class="icon">👤</span><span>Профиль</span></button>
    </div>

    <!-- ЭКРАН 1: Анкета -->
    <div id="screen-step1" class="screen active">
        <div class="form-header">
            <h2>Ваша анкета</h2>
            <p>Заполните данные о себе</p>
        </div>
        <form style="display: flex; flex-direction: column; flex: 1;" onsubmit="goToStep2(event)">
            <div class="form-group"><label>ФИО</label><input type="text" id="reg-name" placeholder="Иван Иванов" required></div>
            <div class="form-group"><label>ВОЗРАСТ</label><input type="number" id="reg-age" placeholder="25" required></div>
            
            <div class="form-group">
                <label>Фотографии профиля</label>
                <input type="file" id="reg-photos-input" accept="image/*" multiple style="display: none;" onchange="handleProfilePhotosUpload(event)">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('reg-photos-input').click()">🖼️ Выбрать фото</button>
                <div class="preview-thumbnails" id="profile-photos-preview"></div>
            </div>

            <div class="form-group"><label>УВЛЕЧЕНИЯ</label><input type="text" id="reg-hobbies" placeholder="Спорт, путешествия"></div>
            <div class="form-group">
                <label>РОД ДЕЯТЕЛЬНОСТИ</label>
                <select id="reg-job" required>
                    <option value="" disabled selected hidden>Выберите род деятельности...</option>
                    <option value="Образование и наука">Образование и наука</option>
                    <option value="IT, интернет и технологии">IT, интернет и технологии</option>
                    <option value="Финансы и банки">Финансы и банки</option>
                    <option value="Медицина">Медицина</option>
                    <option value="Искусство и медиа">Искусство и медиа</option>
                    <option value="Бизнес и продажи">Бизнес и продажи</option>
                    <option value="Другое">Другое</option>
                </select>
            </div>
            <div class="form-group"><label>БЫСТРЫЕ ТЕМЫ ДЛЯ РАЗГОВОРА</label><textarea id="reg-topics" rows="2" style="resize: none;" placeholder="Кино, IT..."></textarea></div>
            <div class="row-3" style="margin-top: 4px; margin-bottom: 10px;">
                <div class="form-group"><label>Пол *</label><select id="reg-gender" required><option value="Мужчина">Муж</option><option value="Женщина">Жен</option></select></div>
                <div class="form-group"><label>Рост (см)</label><input type="number" id="reg-height" placeholder="180"></div>
                <div class="form-group"><label>Вес (кг)</label><input type="number" id="reg-weight" placeholder="75"></div>
            </div>
            <button type="submit" class="btn">Далее</button>
        </form>
    </div>

    <!-- ЭКРАН 2: География и Система рекомендаций -->
    <div id="screen-step2" class="screen">
        <h2 style="text-align: center; color: var(--accent); margin-bottom: 15px;">Настройки поиска</h2>
        <form style="display: flex; flex-direction: column; gap: 10px;" onsubmit="completeRegistration(event)">
            <div class="form-group">
                <label>Кого ищем?</label>
                <select id="recommendation-preference" required>
                    <option value="any" selected>🌐 Всех подряд (для тестов / без ограничений)</option>
                    <option value="opposite">🎯 Только противоположный пол</option>
                    <option value="same">👥 Только мой пол</option>
                </select>
            </div>
            <div class="form-group"><label>Город *</label><input type="text" id="geo-city" placeholder="Ташкент" required></div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button type="button" class="btn btn-secondary" style="flex:1;" onclick="showScreen('screen-step1')">Назад</button>
                <button type="submit" class="btn" id="reg-submit-btn" style="flex:2;">Сохранить и искать</button>
            </div>
        </form>
    </div>

    <!-- ЭКРАН 3: Карточки (Поиск) -->
    <div id="screen-swipe" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span id="user-location-tag" style="font-size: 0.8rem; color: var(--text-sub);">📍 Ташкент</span>
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="showScreen('screen-step2')">Настройки</button>
        </div>
        <div id="card-container" style="flex: 1; display: flex; flex-direction: column;"></div>
        <div class="actions" id="swipe-actions">
            <button class="action-btn dislike" onclick="handleSwipe(false)">✖</button>
            <button class="btn btn-secondary" style="padding: 6px 10px; font-size: 0.72rem; color: var(--danger); border-color: var(--danger);" onclick="reportOrBlockCurrentProfile()">⚠️ Блок</button>
            <button class="action-btn like" onclick="handleSwipe(true)">❤️</button>
        </div>
    </div>

    <!-- ЭКРАН 4: Типаж -->
    <div id="screen-preference" class="screen">
        <div class="form-header">
            <h2>Типаж</h2>
            <p>Параметры партнёра</p>
        </div>
        <form style="display: flex; flex-direction: column; gap: 12px;" onsubmit="saveTargetType(event)">
            <div class="row-2">
                <div class="form-group"><label>Рост от (см)</label><input type="number" id="pref-height-min" placeholder="160"></div>
                <div class="form-group"><label>Рост до (см)</label><input type="number" id="pref-height-max" placeholder="185"></div>
            </div>
            <button type="submit" class="btn">Сохранить</button>
        </form>
    </div>

    <!-- ЭКРАН 5: Список чатов -->
    <div id="screen-chats-list" class="screen">
        <h2 style="margin-bottom: 15px; font-size: 1.3rem;">Сообщения</h2>
        <div id="chats-container" style="flex: 1; overflow-y: auto;">
            <p style="color: var(--text-sub); font-size: 0.9rem; text-align: center; margin-top: 40px;">Загрузка чатов...</p>
        </div>
    </div>

    <!-- ЭКРАН 6: Чат -->
    <div id="screen-chat" class="screen">
        <div class="chat-header">
            <button class="btn btn-secondary" style="padding: 5px 8px; font-size: 0.75rem;" onclick="showScreen('screen-chats-list')">← Назад</button>
            <div style="display: flex; align-items: center; gap: 8px;">
                <img id="chat-partner-avatar" class="avatar-small" src="" alt="avatar">
                <div>
                    <h3 id="chat-partner-name" style="font-size: 0.95rem;">Имя</h3>
                    <span id="chat-partner-status" style="font-size: 0.68rem; color: var(--text-sub);">оффлайн</span>
                </div>
            </div>
            <button class="btn" style="padding: 5px 8px; font-size: 0.75rem;" onclick="openMapModal()">📍 Место</button>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="chat-input" id="chat-input-box">
            <button class="btn btn-secondary" id="chat-file-btn" onclick="triggerMediaUpload()">📎</button>
            <button class="btn btn-secondary" id="voice-record-btn" onclick="toggleVoiceRecording()">🎙️</button>
            <input type="file" id="media-file-input" accept="image/*,audio/*" style="display: none;" onchange="handleFileSelected(event)">
            <input type="text" id="chat-input-field" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') window.sendMessage()">
            <button class="btn" id="chat-send-btn" onclick="window.sendMessage()">➤</button>
        </div>
    </div>

    <!-- ЭКРАН 7: Мой профиль -->
    <div id="screen-profile" class="screen">
        <h2 style="margin-bottom: 15px; font-size: 1.3rem; text-align: center;">Мой профиль</h2>
        <div class="profile-card" style="flex: unset; padding: 20px; gap: 15px;">
            <div id="profile-info-block" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
    </div>

    <!-- МОДАЛКА ВСТРЕЧИ НА КАРТЕ (LEAFLET) -->
    <div id="map-modal" class="map-modal">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 1rem;">Выберите место (OpenStreetMap)</h3>
            <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;" onclick="closeMapModal()">Закрыть</button>
        </div>
        <div id="leaflet-map"></div>
        <div class="form-group">
            <label>Предлагаемое время</label>
            <input type="time" id="meet-time" value="19:00">
        </div>
        <button class="btn" onclick="sendLocationToChat()">Отправить карту в чат</button>
    </div>
</div>

<script>
    function acceptDisclaimer() { localStorage.setItem('app_disclaimer_accepted', 'true'); document.getElementById('disclaimer-modal').style.display = 'none'; }
    function declineDisclaimer() { window.location.href = "about:blank"; }

    let userData = JSON.parse(localStorage.getItem('app_user_data') || '{}');
    let blockedUsers = JSON.parse(localStorage.getItem('app_blocked_users') || '[]');
    let selectedFilesToUpload = [];
    let filteredProfiles = [];
    let currentProfileIndex = 0;
    let activePartnerUid = null;
    let activeChatId = null;
    let leafletMap = null;
    let leafletMarker = null;
    let selectedCoords = null;

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function escapeHtml(str) {
        return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function saveData() {
        localStorage.setItem('app_user_data', JSON.stringify(userData));
        localStorage.setItem('app_blocked_users', JSON.stringify(blockedUsers));
    }

    function goToStep2(e) {
        e.preventDefault();
        userData.name = document.getElementById('reg-name').value.trim();
        userData.age = Number(document.getElementById('reg-age').value);
        userData.hobbies = document.getElementById('reg-hobbies').value;
        userData.job = document.getElementById('reg-job').value;
        userData.topics = document.getElementById('reg-topics').value;
        userData.gender = document.getElementById('reg-gender').value;
        userData.height = Number(document.getElementById('reg-height').value) || null;
        userData.weight = Number(document.getElementById('reg-weight').value) || null;
        saveData();
        showScreen('screen-step2');
    }

    function handleProfilePhotosUpload(event) {
        selectedFilesToUpload = Array.from(event.target.files);
        const container = document.getElementById('profile-photos-preview');
        container.innerHTML = '';
        selectedFilesToUpload.forEach(file => {
            const img = document.createElement('img');
            img.className = 'preview-thumb';
            img.src = URL.createObjectURL(file);
            container.appendChild(img);
        });
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function switchNavTab(screenId) {
        showScreen(screenId);
        document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
        if (screenId === 'screen-swipe') document.getElementById('nav-btn-swipe').classList.add('active');
        if (screenId === 'screen-preference') document.getElementById('nav-btn-preference').classList.add('active');
        if (screenId === 'screen-chats-list') document.getElementById('nav-btn-chats').classList.add('active');
        if (screenId === 'screen-profile') {
            document.getElementById('nav-btn-profile').classList.add('active');
            updateProfileView();
        }
    }

    function updateProfileView() {
        document.getElementById('profile-info-block').innerHTML = `
            <div style="text-align:center;"><img class="avatar-img" style="width:80px;height:80px;" src="${userData.photo || ''}"></div>
            <div><b>Имя:</b> ${escapeHtml(userData.name)}</div>
            <div><b>Возраст:</b> ${escapeHtml(userData.age)}</div>
            <div><b>Пол:</b> ${escapeHtml(userData.gender)}</div>
            <div><b>Город:</b> ${escapeHtml(userData.city)}</div>
        `;
    }

    function openMapModal() {
        document.getElementById('map-modal').classList.add('active');
        setTimeout(() => {
            if (!leafletMap) {
                leafletMap = L.map('leaflet-map').setView([41.311081, 69.240562], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(leafletMap);

                leafletMap.on('click', function(e) {
                    selectedCoords = e.latlng;
                    if (leafletMarker) leafletMap.removeLayer(leafletMarker);
                    leafletMarker = L.marker(e.latlng).addTo(leafletMap);
                });
            } else {
                leafletMap.invalidateSize();
            }
        }, 300);
    }

    function closeMapModal() { document.getElementById('map-modal').classList.remove('active'); }

    function sendLocationToChat() {
        if (!selectedCoords) return alert("Выберите место на карте!");
        const time = document.getElementById('meet-time').value;
        const mapUrl = `https://www.openstreetmap.org/?mlat=${selectedCoords.lat}&mlon=${selectedCoords.lng}#map=16/${selectedCoords.lat}/${selectedCoords.lng}`;
        window.sendChatMessage(`📍 <b>Встреча в ${escapeHtml(time)}</b><br><a href="${mapUrl}" target="_blank" style="color:#60a5fa;">Открыть карту</a>`, true);
        closeMapModal();
    }

    window.addEventListener('DOMContentLoaded', () => {
        if (localStorage.getItem('app_disclaimer_accepted') === 'true') {
            document.getElementById('disclaimer-modal').style.display = 'none';
        }
    });
</script>

<!-- FIREBASE SDK И ОСНОВНАЯ ЛОГИКА -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, where, limit, startAfter, addDoc, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCFl9_bOVzbtZwNPOxaNJb3BfW2XB0Jpgg",
        authDomain: "dating-uz.firebaseapp.com",
        projectId: "dating-uz",
        storageBucket: "dating-uz.firebasestorage.app",
        messagingSenderId: "1046578611265",
        appId: "1:1046578611265:web:97597ee1a45dc4d192f2c0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    let myUid = null;
    let lastVisibleDoc = null;
    let unsubscribeChat = null;

    // Вход: Вариант с Telegram WebApp ID или Анонимной авторизацией Firebase
    onAuthStateChanged(auth, async (user) => {
        if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
            myUid = "tg_" + window.Telegram.WebApp.initDataUnsafe.user.id;
        } else if (user) {
            myUid = user.uid;
        } else {
            const creds = await signInAnonymously(auth);
            myUid = creds.user.uid;
        }
        userData.uid = myUid;
        saveData();

        const myDoc = await getDoc(doc(db, "users", myUid));
        if (myDoc.exists()) {
            userData = { ...userData, ...myDoc.data() };
            saveData();
            if (userData.isRegistered) {
                initSearchScreen();
                window.listenUserChats();
            }
        }
    });

    // Функция загрузки файлов на Firebase Storage
    async function uploadFileToStorage(file, path) {
        const fileRef = ref(storage, `${path}/${Date.now()}_${file.name || 'file'}`);
        await uploadBytes(fileRef, file);
        return await getDownloadURL(fileRef);
    }

    window.completeRegistration = async function(e) {
        if (e) e.preventDefault();
        const btn = document.getElementById('reg-submit-btn');
        btn.textContent = "Сохранение..."; btn.disabled = true;

        userData.city = document.getElementById('geo-city').value || "Ташкент";
        userData.recommendationPref = document.getElementById('recommendation-preference').value;
        userData.lastSeen = Date.now();

        try {
            // Загрузка фоток на Firebase Storage вместо Base64
            let photoUrls = [];
            if (selectedFilesToUpload.length > 0) {
                for (let file of selectedFilesToUpload) {
                    const url = await uploadFileToStorage(file, `profiles/${myUid}`);
                    photoUrls.push(url);
                }
            }
            if (photoUrls.length) {
                userData.photos = photoUrls;
                userData.photo = photoUrls[0];
            } else if (!userData.photo) {
                userData.photo = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600";
                userData.photos = [userData.photo];
            }

            userData.isRegistered = true;
            saveData();

            // setDoc предотвращает дублирование анкет!
            await setDoc(doc(db, "users", myUid), userData, { merge: true });

            initSearchScreen();
            window.listenUserChats();
        } catch (err) {
            alert("Ошибка сохранения: " + err.message);
        } finally {
            btn.textContent = "Сохранить и искать"; btn.disabled = false;
        }
    };

    // Загрузка анкет с пагинацией и гибкой фильтрацией
    window.loadProfilesFromFirebase = async function(isNextPage = false) {
        try {
            let qConstraints = [collection(db, "users"), limit(10)];

            if (userData.recommendationPref === 'opposite') {
                const targetGender = (userData.gender === "Мужчина") ? "Женщина" : "Мужчина";
                qConstraints.push(where("gender", "==", targetGender));
            } else if (userData.recommendationPref === 'same') {
                qConstraints.push(where("gender", "==", userData.gender));
            }

            if (isNextPage && lastVisibleDoc) {
                qConstraints.push(startAfter(lastVisibleDoc));
            }

            const q = query(...qConstraints);
            const snap = await getDocs(q);

            if (!snap.empty) {
                lastVisibleDoc = snap.docs[snap.docs.length - 1];
            }

            const profiles = [];
            snap.forEach(docSnap => {
                const p = docSnap.data();
                if (p.uid !== myUid && !blockedUsers.includes(p.uid)) {
                    profiles.push(p);
                }
            });
            return profiles;
        } catch (e) {
            console.error(e);
            return [];
        }
    };

    async function initSearchScreen() {
        document.getElementById('user-location-tag').textContent = `📍 ${userData.city}`;
        filteredProfiles = await window.loadProfilesFromFirebase(false);
        currentProfileIndex = 0;
        renderSwipeCard();

        document.getElementById('bottom-nav').classList.add('active');
        showScreen('screen-swipe');
        document.getElementById('nav-btn-swipe').classList.add('active');
    }

    function renderSwipeCard() {
        const container = document.getElementById('card-container');
        const actions = document.getElementById('swipe-actions');

        if (!filteredProfiles || currentProfileIndex >= filteredProfiles.length) {
            container.innerHTML = `
                <div class="profile-card" style="justify-content:center; align-items:center; text-align:center; padding:20px;">
                    <h3>Анкеты закончились 🎉</h3>
                    <button class="btn" style="margin-top:10px;" onclick="loadMoreProfiles()">Загрузить еще</button>
                </div>
            `;
            actions.style.display = "none";
            return;
        }

        actions.style.display = "flex";
        const p = filteredProfiles[currentProfileIndex];
        container.innerHTML = `
            <div class="profile-card">
                <div class="profile-card-image" style="background-image: url('${p.photo}');">
                    <div class="profile-card-image-overlay">
                        <h2>${escapeHtml(p.name)}, ${escapeHtml(p.age)}</h2>
                        <span>📍 ${escapeHtml(p.city)}</span>
                    </div>
                </div>
                <div class="profile-card-body">
                    <div class="badge-grid"><span class="badge badge-accent">💼 ${escapeHtml(p.job)}</span></div>
                    <div><label>Увлечения</label><p>${escapeHtml(p.hobbies)}</p></div>
                </div>
            </div>
        `;
    }

    window.loadMoreProfiles = async function() {
        const more = await window.loadProfilesFromFirebase(true);
        if (more.length > 0) {
            filteredProfiles = more;
            currentProfileIndex = 0;
            renderSwipeCard();
        } else {
            alert("Больше анкет не найдено!");
        }
    };

    window.handleSwipe = function(isLike) {
        const current = filteredProfiles[currentProfileIndex];
        if (isLike && current) {
            window.openChat(current.uid, current.name, current.photo);
        } else {
            currentProfileIndex++;
            renderSwipeCard();
        }
    };

    window.reportOrBlockCurrentProfile = function() {
        const current = filteredProfiles[currentProfileIndex];
        if (current) {
            blockedUsers.push(current.uid);
            saveData();
            currentProfileIndex++;
            renderSwipeCard();
        }
    };

    // Оптимизированные диалоги (Sub-collections/Компоновка chatId)
    function getChatId(uid1, uid2) {
        return [uid1, uid2].sort().join('_');
    }

    window.openChat = function(partnerUid, partnerName, partnerPhoto) {
        activePartnerUid = partnerUid;
        activeChatId = getChatId(myUid, partnerUid);

        document.getElementById('chat-partner-name').textContent = partnerName || 'Собеседник';
        document.getElementById('chat-partner-avatar').src = partnerPhoto || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200';

        showScreen('screen-chat');
        const msgContainer = document.getElementById('chat-messages');
        msgContainer.innerHTML = '';

        if (unsubscribeChat) unsubscribeChat();

        // Запрос ТОЛЬКО конкретного чата (экономит лимиты чтения Firestore)
        const q = query(
            collection(db, "chats", activeChatId, "messages"),
            orderBy("timestamp", "asc"),
            limit(50)
        );

        unsubscribeChat = onSnapshot(q, (snap) => {
            msgContainer.innerHTML = '';
            snap.forEach(docSnap => {
                const msg = docSnap.data();
                const div = document.createElement('div');
                div.className = `message ${msg.senderUid === myUid ? 'user' : 'match'}`;
                if (msg.isHtml) div.innerHTML = msg.text;
                else div.textContent = msg.text;
                msgContainer.appendChild(div);
            });
            msgContainer.scrollTop = msgContainer.scrollHeight;
        });
    };

    window.sendChatMessage = async function(customText, isHtml = false) {
        const input = document.getElementById('chat-input-field');
        const text = customText || input.value.trim();
        if (!text || !activeChatId) return;

        if (!customText) input.value = '';

        const msgData = {
            senderUid: myUid,
            text: text,
            isHtml: isHtml,
            timestamp: Date.now()
        };

        await addDoc(collection(db, "chats", activeChatId, "messages"), msgData);

        // Обновляем метаданные диалога
        await setDoc(doc(db, "chats", activeChatId), {
            lastMessage: text,
            lastTimestamp: Date.now(),
            participants: [myUid, activePartnerUid]
        }, { merge: true });
    };

    window.sendMessage = function() { window.sendChatMessage(); };

    // Слушатель всех диалогов текущего пользователя
    window.listenUserChats = function() {
        const q = query(collection(db, "chats"), where("participants", "array-contains", myUid));
        onSnapshot(q, async (snap) => {
            const container = document.getElementById('chats-container');
            container.innerHTML = '';

            if (snap.empty) {
                container.innerHTML = `<p style="color:var(--text-sub); text-align:center; margin-top:40px;">Чатов пока нет.</p>`;
                return;
            }

            for (let docSnap of snap.docs) {
                const chat = docSnap.data();
                const partnerUid = chat.participants.find(id => id !== myUid);
                if (blockedUsers.includes(partnerUid)) continue;

                const partnerDoc = await getDoc(doc(db, "users", partnerUid));
                const partnerData = partnerDoc.exists() ? partnerDoc.data() : { name: 'Пользователь', photo: '' };

                const item = document.createElement('div');
                item.className = 'chat-list-item';
                item.onclick = () => window.openChat(partnerUid, partnerData.name, partnerData.photo);
                item.innerHTML = `
                    <div class="chat-item-header">
                        <img class="avatar-img" src="${partnerData.photo}">
                        <div>
                            <h4 style="color:#fff;">${escapeHtml(partnerData.name)}</h4>
                            <p style="font-size:0.8rem; color:var(--text-sub);">${escapeHtml(chat.lastMessage || '')}</p>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            }
        });
    };

    // Медиазагрузка в чате (Фото/Файлы на Storage)
    window.triggerMediaUpload = function() { document.getElementById('media-file-input').click(); };

    window.handleFileSelected = async function(e) {
        const file = e.target.files[0];
        if (!file || !activeChatId) return;

        const url = await uploadFileToStorage(file, `chat_media/${activeChatId}`);
        if (file.type.startsWith('image/')) {
            window.sendChatMessage(`<img src="${url}" style="max-width:100%; border-radius:8px;">`, true);
        } else if (file.type.startsWith('audio/')) {
            window.sendChatMessage(`<audio controls src="${url}"></audio>`, true);
        }
    };

    // Исправленный микрофон без утечек памяти
    window.toggleVoiceRecording = async function() {
        const btn = document.getElementById('voice-record-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    // Гарантированное освобождение микрофона!
                    stream.getTracks().forEach(track => track.stop());

                    if (audioChunks.length > 0) {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioFile = new File([blob], "voice.webm", { type: "audio/webm" });
                        const url = await uploadFileToStorage(audioFile, `chat_media/${activeChatId}`);
                        window.sendChatMessage(`<audio controls src="${url}"></audio>`, true);
                    }
                };

                mediaRecorder.start();
                isRecording = true;
                btn.style.background = 'var(--danger)';
            } catch (err) {
                alert("Нет доступа к микрофону");
            }
        } else {
            isRecording = false;
            btn.style.background = 'transparent';
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop();
            }
        }
    };
</script>
